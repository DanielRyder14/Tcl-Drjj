<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใยแมงมุม 🕷️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  position: relative;
  width: 360px;
  height: 500px;
}

/* หัวข้อ */
h1 {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  font-size: 24px;
}

/* แมงมุม */
.spider {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 65px;
  z-index: 5;
}

/* วงใย */
.web {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid #aaa;
  border-radius: 50%;
  cursor: pointer;
  transition: .4s;
}

/* แต่ละชั้น */
.web1 {
  width: 110px;
  height: 110px;
  z-index: 4;
}

.web2 {
  width: 180px;
  height: 180px;
  z-index: 3;
}

.web3 {
  width: 250px;
  height: 250px;
  z-index: 2;
}

.web4 {
  width: 320px;
  height: 320px;
  z-index: 1;
}

.web:hover {
  border-color: white;
  box-shadow: 0 0 15px white;
}

/* ตอนถูกกด */
.web.clicked {
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.3);
  pointer-events: none;
}

/* ข้อความ */
.message {
  position: absolute;
  bottom: 30px;
  left: 20px;
  right: 20px;

  background: #151515;
  border: 1px solid #555;
  border-radius: 15px;
  padding: 18px;

  text-align: center;
  font-size: 19px;
  font-weight: bold;

  opacity: 0;
  transform: translateY(20px);
  transition: .4s;

  z-index: 20;
}

.message.show {
  opacity: 1;
  transform: translateY(0);
}

.hint {
  position: absolute;
  bottom: 5px;
  width: 100%;
  text-align: center;
  color: #888;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <h1>🕷️ กดใยดูข้อความ 🕸️</h1>

  <!-- ใยแต่ละวง -->
  <div class="web web4" onclick="showText(this, 3)"></div>
  <div class="web web3" onclick="showText(this, 2)"></div>
  <div class="web web2" onclick="showText(this, 1)"></div>
  <div class="web web1" onclick="showText(this, 0)"></div>

  <div class="spider">🕷️</div>

  <div id="message" class="message"></div>

  <div class="hint">
    กดที่วงใย 🕸️
  </div>

</div>

<script>

const messages = [
  "ไอ้เหี้ย มึงนี่ว่างมากสินะถึงมากดทุกวง 😂",
  "หน้ามึงตอนนี้คงงงอยู่ว่ากดมาทำไม 555",
  "มึงนี่เสือกจริง ๆ อะไรก็กดหมด 🤣",
  "หมดแล้วไอ้สัส ไปทำอย่างอื่นได้แล้ว 😂"
];

function showText(element, number) {

  const message = document.getElementById("message");

  element.classList.add("clicked");

  message.classList.remove("show");

  setTimeout(() => {
    message.innerText = messages[number];
    message.classList.add("show");
  }, 200);
}

</script>

</body>
</html>
